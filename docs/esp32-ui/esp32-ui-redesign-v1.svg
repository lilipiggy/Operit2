<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1520" viewBox="0 0 1600 1520" role="img" aria-labelledby="title desc">
<title id="title">Operit ESP32 界面重设计 · 四种状态</title>
<desc id="desc">320×240 横屏。统一深绿主题；固定侧栏头尾和半屏可滚动角色对话分组；输入框右侧发送与语音占位；带拖动把手的屏内浮动键盘；未配对自动引导。</desc>
<defs>
<symbol id="menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
