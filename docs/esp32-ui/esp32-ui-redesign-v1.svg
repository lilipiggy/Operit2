rx="4" fill="#2b4034" /><text x="290.5" y="203" font-size="13" fill="#dcece8" text-anchor="middle">⌫</text><rect x="17" y="212" width="44" height="20" rx="4" fill="#2b4034" /><text x="39" y="226" font-size="10" fill="#dcece8" text-anchor="middle">123</text><rect x="65" y="212" width="40" height="20" rx="4" fill="#2b4034" /><text x="85" y="226" font-size="9" fill="#dcece8" text-anchor="middle">中 / EN</text><rect x="109" y="212" width="139" height="20" rx="4" fill="#3a5044" /><text x="178.5" y="226" font-size="10" fill="#dcece8" text-anchor="middle">空格</text><rect x="252" y="212" width="51" height="20" rx="4" fill="#8bd3b7" /><text x="277.5" y="226" font-size="11" fill="#14291f" text-anchor="middle">完成</text></g><text x="70" y="1420" font-size="16" fill="#c2d2c6" >键盘默认贴近底部；输入区上移，发送按钮仍可见。</text><text x="70" y="1446" font-size="14" fill="#91a79b" >拖动时吸附在屏幕边界内，避开输入区；“中 / EN”为输入法位置示意。</text>
<text x="870" y="866" font-size="25" fill="#ecf2ed" font-weight="600">04  首次配对</text><text x="870" y="892" font-size="14" fill="#91a79b" >未配对时自动进入；配对完成后进入聊天</text><rect x="869" y="904" width="642" height="482" rx="13" fill="#102017" stroke="#476051" stroke-width="2"/><g transform="translate(870,905) scale(2)" clip-path="url(#screenClip)"><rect x="0" y="0" width="320" height="240" rx="0" fill="#14211c" /><rect x="0" y="0" width="320" height="40" rx="0" fill="#172522" /><text x="12" y="26" font-size="14" fill="#e4eeeb" >连接 Operit</text><use href="#wifi" x="272" y="12" width="16" height="16" fill="none" stroke="#8bd3b7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="12" y="64" font-size="15" fill="#e4eeeb" >在 Operit 中添加此设备</text><text x="12" y="85" font-size="12" fill="#9cb3a6" >设备 → 添加边缘设备</text><rect x="12" y="101" width="296" height="67" rx="10" fill="#20332c" /><text x="160" y="121" font-size="10" fill="#9cb3a6" text-anchor="middle">配对码</text><text x="160" y="153" font-size="30" fill="#8bd3b7" text-anchor="middle" font-family="Consolas, monospace" letter-spacing="5">482 619</text><circle cx="19" cy="187" r="3" fill="#8bd3b7"/><text x="29" y="192" font-size="12" fill="#bfd2c5" >等待确认配对…</text><rect x="12" y="204" width="296" height="28" rx="7" fill="#263d30" /><text x="160" y="223" font-size="12" fill="#c2d6c9" text-anchor="middle">连接帮助</text></g><text x="870" y="1420" font-size="16" fill="#c2d2c6" >Wi-Fi、配对码与等待状态由设备真实状态驱动。</text><text x="870" y="1446" font-size="14" fill="#91a79b" >已配对设备从侧栏右上角取消配对；操作前二次确认。</text>
<text x="70" y="1490" font-size="13" fill="#789183" >设计示意：角色、对话、消息和配对码均为样例；实际内容需要来自运行状态。</text>
</g></svg>
