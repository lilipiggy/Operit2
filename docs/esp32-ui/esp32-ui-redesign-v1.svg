<symbol id="back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
<symbol id="wifi" viewBox="0 0 24 24"><path d="M3 8a14 14 0 0 1 18 0M6 12a9 9 0 0 1 12 0M9 16a4 4 0 0 1 6 0"/><circle cx="12" cy="20" r=".7"/></symbol><clipPath id="screenClip"><rect width="320" height="240" rx="6"/></clipPath><clipPath id="groupsClip"><rect x="8" y="69" width="224" height="119" rx="9"/></clipPath></defs>
<g font-family="'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
<rect x="0" y="0" width="1600" height="1520" rx="0" fill="#0d1712" />
<text x="70" y="59" font-size="14" fill="#8bd3b7" letter-spacing="3">OPERIT / ESP32</text>
<text x="70" y="108" font-size="36" fill="#ecf2ed" font-weight="600">从屏幕重新设计</text>
<text x="70" y="142" font-size="17" fill="#91a79b" >320 × 240 横屏 · 四种交互状态 · 统一深绿主题 · SVG 设计稿</text>
<text x="1510" y="65" font-size="14" fill="#789183" text-anchor="end" letter-spacing="2">DESIGN 01</text>
<text x="70" y="196" font-size="25" fill="#ecf2ed" font-weight="600">01  聊天主页面</text><text x="70" y="222" font-size="14" fill="#91a79b" >保留内容空间，让输入与发送始终容易找到</text><rect x="69" y="234" width="642" height="482" rx="13" fill="#102017" stroke="#476051" stroke-width="2"/><g transform="translate(70,235) scale(2)" clip-path="url(#screenClip)"><rect x="0" y="0" width="320" height="240" rx="0" fill="#14211c" /><rect x="0" y="0" width="320" height="40" rx="0" fill="#172522" /><use href="#menu" x="12" y="12" width="18" height="18" fill="none" stroke="#dcece8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="26" font-size="14" fill="#e4eeeb" >日常助手</text><text x="304" y="25" font-size="10" fill="#80c7b0" text-anchor="end">● 已连接</text><path d="M0 40h320" stroke="#2b3d37"/><rect x="150" y="51" width="158" height="31" rx="9" fill="#304c3e" /><text x="162" y="72" font-size="13" fill="#e4eeeb" >帮我安排今天的工作</text><text x="12" y="104" font-size="11" fill="#8bd3b7" >日常助手</text><text x="12" y="126" font-size="14" fill="#e4eeeb" >先完成最重要的一件事，</text><text x="12" y="148" font-size="14" fill="#e4eeeb" >再安排沟通和整理。</text><text x="12" y="175" font-size="14" fill="#e4eeeb" >你今天最想推进什么？</text><rect x="314" y="92" width="2" height="70" rx="1" fill="#2c4036" /><rect x="8" y="198" width="220" height="34" rx="9" fill="#20332c" /><text x="18" y="220" font-size="13" fill="#91a99f" >输入消息…</text><rect x="234" y="198" width="34" height="34" rx="9" fill="#8bd3b7" /><use href="#send" x="242" y="206" width="18" height="18" fill="none" stroke="#14291f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="274" y="198" width="38" height="34" rx="9" fill="#20332c" /><use href="#mic" x="285" y="205" width="17" height="17" fill="none" stroke="#71877e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="70" y="750" font-size="16" fill="#c2d2c6" >输入框右侧：发送 + 语音占位。</text><text x="70" y="776" font-size="14" fill="#91a79b" >消息区独立滚动；语音以弱化图标表示尚未开放。</text>
<text x="870" y="196" font-size="25" fill="#ecf2ed" font-weight="600">02  展开侧边栏</text><text x="870" y="222" font-size="14" fill="#91a79b" >同一套背景、文字与强调色；抽屉约占屏幕 75%</text><rect x="869" y="234" width="642" height="482" rx="13" fill="#102017" stroke="#476051" stroke-width="2"/><g transform="translate(870,235) scale(2)" clip-path="url(#screenClip)"><rect x="0" y="0" width="320" height="240" rx="0" fill="#14211c" /><rect x="0" y="0" width="320" height="40" rx="0" fill="#172522" /><use href="#menu" x="12" y="12" width="18" height="18" fill="none" stroke="#dcece8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="26" font-size="14" fill="#e4eeeb" >日常助手</text><text x="304" y="25" font-size="10" fill="#80c7b0" text-anchor="end">● 已连接</text><path d="M0 40h320" stroke="#2b3d37"/><rect x="150" y="51" width="158" height="31" rx="9" fill="#304c3e" /><text x="162" y="72" font-size="13" fill="#e4eeeb" >帮我安排今天的工作</text><text x="12" y="104" font-size="11" fill="#8bd3b7" >日常助手</text><text x="12" y="126" font-size="14" fill="#e4eeeb" >先完成最重要的一件事，</text><text x="12" y="148" font-size="14" fill="#e4eeeb" >再安排沟通和整理。</text><text x="12" y="175" font-size="14" fill="#e4eeeb" >你今天最想推进什么？</text><rect x="314" y="92" width="2" height="70" rx="1" fill="#2c4036" /><rect x="8" y="198" width="220" height="34" rx="9" fill="#20332c" /><text x="18" y="220" font-size="13" fill="#91a99f" >输入消息…</text><rect x="234" y="198" width="34" height="34" rx="9" fill="#8bd3b7" /><use href="#send" x="242" y="206" width="18" height="18" fill="none" stroke="#14291f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="274" y="198" width="38" height="34" rx="9" fill="#20332c" /><use href="#mic" x="285" y="205" width="17" height="17" fill="none" stroke="#71877e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="0" width="320" height="240" rx="0" fill="#08120d" opacity=".45"/><rect x="0" y="0" width="240" height="240" rx="0" fill="#20332c" /><text x="12" y="24" font-size="14" fill="#e4eeeb" >对话</text><rect x="170" y="7" width="62" height="26" rx="6" fill="#20332c" stroke="#53695d"/><text x="201" y="24" font-size="11" fill="#c4d5cd" text-anchor="middle">取消配对</text><rect x="8" y="36" width="224" height="28" rx="7" fill="#8bd3b7" /><text x="20" y="55" font-size="13" fill="#14291f" >新建对话</text><use href="#plus" x="205" y="42" width="17" height="17" fill="none" stroke="#14291f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><g clip-path="url(#groupsClip)"><rect x="8" y="69" width="224" height="119" rx="9" fill="#182920" /><rect x="16" y="78" width="24" height="24" rx="7" fill="#375342" /><text x="28" y="95" font-size="12" fill="#e4eeeb" text-anchor="middle">日</text><text x="48" y="95" font-size="13" fill="#e4eeeb" >日常助手</text><use href="#chevron" x="204" y="82" width="16" height="16" fill="none" stroke="#9aafa5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="16" y="108" width="204" height="28" rx="6" fill="#304c3e" /><use href="#chat" x="24" y="116" width="12" height="12" fill="none" stroke="#9edbc0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="127" font-size="12" fill="#e4eeeb" >今天的工作计划</text><use href="#chat" x="24" y="147" width="12" height="12" fill="none" stroke="#7f9a8c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="45" y="158" font-size="12" fill="#9aafa5" >周末出行</text><rect x="16" y="170" width="24" height="24" rx="7" fill="#314034" /><text x="48" y="187" font-size="13" fill="#e4eeeb" >学习搭档</text></g><rect x="227" y="81" width="2" height="95" rx="1" fill="#2e4438" /><rect x="227" y="83" width="2" height="43" rx="1" fill="#718e7b" /><path d="M8 196h224" stroke="#3a5043"/><rect x="8" y="203" width="108" height="29" rx="7" fill="#20332c" /><use href="#plug" x="18" y="209" width="17" height="17" fill="none" stroke="#aec5b7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="43" y="223" font-size="13" fill="#e4eeeb" >插件</text><rect x="124" y="203" width="108" height="29" rx="7" fill="#20332c" /><use href="#settings" x="134" y="209" width="17" height="17" fill="none" stroke="#aec5b7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="159" y="223" font-size="13" fill="#e4eeeb" >设置</text><use href="#close" x="272" y="12" width="18" height="18" fill="none" stroke="#afc0b6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="870" y="750" font-size="16" fill="#c2d2c6" >角色卡包含对话；中间约半屏高，独立滚动。</text><text x="870" y="776" font-size="14" fill="#91a79b" >顶部固定新建与取消配对，底部固定插件与设置；120 ms 滑入。</text>
<text x="70" y="866" font-size="25" fill="#ecf2ed" font-weight="600">03  输入与浮动键盘</text><text x="70" y="892" font-size="14" fill="#91a79b" >专用拖动把手，避免把敲击按键误识别成拖拽</text><rect x="69" y="904" width="642" height="482" rx="13" fill="#102017" stroke="#476051" stroke-width="2"/><g transform="translate(70,905) scale(2)" clip-path="url(#screenClip)"><rect x="0" y="0" width="320" height="240" rx="0" fill="#14211c" /><rect x="0" y="0" width="320" height="40" rx="0" fill="#172522" /><use href="#menu" x="12" y="12" width="18" height="18" fill="none" stroke="#dcece8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="26" font-size="14" fill="#e4eeeb" >日常助手</text><text x="304" y="25" font-size="10" fill="#80c7b0" text-anchor="end">● 已连接</text><path d="M0 40h320" stroke="#2b3d37"/><text x="12" y="59" font-size="12" fill="#91a99f" >你今天最想推进什么？</text><rect x="8" y="70" width="220" height="34" rx="9" fill="#20332c" stroke="#8bd3b7"/><text x="18" y="92" font-size="13" fill="#e4eeeb" >先完善设备界面</text><path d="M128 79v17" stroke="#8bd3b7"/><rect x="234" y="70" width="34" height="34" rx="9" fill="#8bd3b7" /><use href="#send" x="242" y="78" width="18" height="18" fill="none" stroke="#14291f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="274" y="70" width="38" height="34" rx="9" fill="#20332c" /><use href="#mic" x="285" y="78" width="17" height="17" fill="none" stroke="#71877e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="114" width="304" height="124" rx="10" fill="#22382b" stroke="#506958"/><rect x="141" y="121" width="38" height="4" rx="2" fill="#829c8b" /><text x="20" y="133" font-size="9" fill="#adc3b5" >拖动</text><use href="#close" x="290" y="119" width="14" height="14" fill="none" stroke="#adc3b5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="17" y="140" width="25" height="21" rx="4" fill="#3a5044" /><text x="29.5" y="155" font-size="11" fill="#eff5f1" text-anchor